server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: maas-hub-backend
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:maas_hub}?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123456}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: MaasHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.maas.hub.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

maas:
  gateway:
    base-path: /v1
    connect-timeout-seconds: 10
    read-timeout-seconds: 120
    max-retry-attempts: 2
    default-token-limit-per-day: 5000000
  jwt:
    secret: MaasUnifiedEnterpriseLlmGatewaySecretKey2026SecureString
    expiration-hours: 24

logging:
  level:
    root: INFO
    com.maas.hub: DEBUG
    org.springframework.web: INFO
